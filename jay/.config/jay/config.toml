#### Resize Mode
[shortcuts.logo-r]
type = "multi"

[[shortcuts.logo-r.actions]]
name = "resize"
type = "push-mode"

[modes.resize.shortcuts.Down]
dy2 = 100
type = "resize"

[modes.resize.shortcuts.Left]
dx1 = -100
type = "resize"

[modes.resize.shortcuts.Right]
dx2 = 100
type = "resize"

[modes.resize.shortcuts.Up]
dy1 = -100
type = "resize"

[modes.resize.shortcuts.Escape]
type = "multi"

[[modes.resize.shortcuts.Escape.actions]]
cmd = "pop-mode"
type = "simple"

[modes.resize.shortcuts.logo-r]
type = "multi"

[[modes.resize.shortcuts.logo-r.actions]]
cmd = "pop-mode"
type = "simple"


#### Inputs
[[inputs]]
tag = "mice"
match.is-pointer = true
natural-scrolling = true
accel-profile = "Flat"
accel-speed = -0.875


#### Monitors
[[outputs]]
name = "left"
match.connector = "DP-2"
x = 0
y = 0
mode = { width = 2560, height = 1440, refresh-rate = 179.999 }
tearing.mode = "variant1"
vrr.mode = "never"

[[outputs]]
name = "right"
match.connector = "HDMI-A-1"
x = 2560
y = 360
mode = { width = 1920, height = 1080, refresh-rate = 100.000 }
tearing.mode = "never"
vrr.mode = "never"


#### Window Rules
[[windows]]
name = "discord"
match.x-class = "discord"
action = [
{ type = "move-to-workspace", name = "7" },
{ type = "move-to-output", workspace = "7", output.name = "right" },
{ type = "set-repeat-rate", rate = { rate = 20, delay = 200 } }
]

[[windows]]
name = "spotify"
match.x-class = "Spotify"
action = [
{ type = "move-to-workspace", name = "10" },
{ type = "move-to-output", workspace = "10", output.name = "right" },
{ type = "set-repeat-rate", rate = { rate = 20, delay = 200 } }
]

[[windows]]
name = "waywall"
match.app-id = "waywall"
action = [
{ type = "move-to-workspace", name = "1" },
{ type = "move-to-output", workspace = "1", output.name = "left" },
{ type = "set-repeat-rate", rate = { rate = 60, delay = 200} }
]

[[windows]]
name = "default"
action = [
{ type = "set-repeat-rate", rate = { rate = 20, delay = 200 } }
]
